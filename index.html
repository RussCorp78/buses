<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bus Stops</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        .buttons {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: #222;
        }

        .buttons button {
            flex: 1;
            padding: 12px 5px;
            border: none;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }

        .buttons button.active {
            background: #ccc;
        }

        #status {
            padding: 10px;
            text-align: center;
        }

        #departures {
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="buttons">
        <button onclick="loadStop('370021129', this)">STOP 1</button>
        <button onclick="loadStop('370023697', this)">STOP 2</button>
        <button onclick="loadStop('370022870', this)">STOP 3</button>
        <button onclick="loadStop('370021171', this)">STOP 4</button>
    </div>

    <div id="status">
        Loading...
    </div>

    <div id="departures"></div>


<script>

async function loadStop(stopCode, button) {

    // Highlight selected button
    document.querySelectorAll(".buttons button").forEach(btn => {
        btn.classList.remove("active");
    });

    if (button) {
        button.classList.add("active");
    }

    document.getElementById("status").textContent =
        "Loading stop " + stopCode + "...";

    try {

        const response = await fetch(
            "https://journeyplanner.travelsouthyorkshire.com/JourneyPlanner/RefreshBusDeparturesModel",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8"
                },

                body: "fromCode=" + encodeURIComponent(stopCode)
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const html = await response.text();

        document.getElementById("departures").innerHTML = html;

        document.getElementById("status").textContent =
            "Stop " + stopCode;

    }
    catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Could not load timetable";

        document.getElementById("departures").innerHTML =
            "<p>" + error.message + "</p>";
    }
}


// Load your fourth stop when the page opens
loadStop("370021171", document.querySelectorAll(".buttons button")[3]);

</script>

</body>
</html>
