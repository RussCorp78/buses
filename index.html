<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheffield Live Bus Times</title>
    <style>
        :root {
            --primary-color: #005A9C;
            --accent-color: #FFCC00;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background-color: #004475;
        }

        button:disabled {
            background-color: #a0b2c6;
            cursor: not-allowed;
            opacity: 0.75;
        }

        .refresh-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
        }

        .last-updated {
            font-size: 13px;
            color: #666;
            font-style: italic;
        }

        .stop-info {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
            font-size: 17px;
        }

        .bus-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .bus-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #eee;
            animation: fadeIn 0.3s ease-in;
        }

        .bus-item:last-child {
            border-bottom: none;
        }

        .bus-number {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            min-width: 40px;
            text-align: center;
            font-size: 18px;
        }

        .bus-details {
            flex: 1;
            margin-left: 15px;
        }

        .bus-destination {
            font-weight: 600;
            font-size: 16px;
        }

        .bus-operator {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }

        .bus-time {
            font-weight: bold;
            font-size: 16px;
            color: #d9534f;
        }

        .bus-time.due {
            color: #5cb85c;
            animation: blink 1s infinite alternate;
        }

        .message {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sheffield Live Buses</h1>
    
    <div class="search-box">
        <input type="text" id="stopCodeInput" value="370010131" placeholder="Enter 9-digit NaPTAN code...">
        <button id="getTimesBtn" onclick="fetchLiveTimes()">Get Times</button>
    </div>

    <div id="stopInfo" class="stop-info"></div>
    
    <div id="refreshBar" class="refresh-bar" style="display: none;">
        <span id="lastUpdated" class="last-updated">Last updated: Never</span>
        <button id="refreshBtn" onclick="fetchLiveTimes()">🔄 Update Now</button>
    </div>

    <ul id="busList" class="bus-list">
        <li class="message">Enter a stop code and press 'Get Times'</li>
    </ul>
</div>

<script>
    const APP_ID = "5b570a85"; 
    const APP_KEY = "f8be8bec50776dc8b206608f829fd71f";

    async function fetchLiveTimes() {
        const stopCode = document.getElementById('stopCodeInput').value.trim();
        const busList = document.getElementById('busList');
        const stopInfo = document.getElementById('stopInfo');
        const refreshBar = document.getElementById('refreshBar');
        const lastUpdated = document.getElementById('lastUpdated');
        const getTimesBtn = document.getElementById('getTimesBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        if (!stopCode) {
            busList.innerHTML = '<li class="message" style="color:red;">Please enter a valid 9-digit stop code.</li>';
            return;
        }

        // Disable buttons during loading state
        getTimesBtn.disabled = true;
        refreshBtn.disabled = true;
        refreshBtn.textContent = "⏳ Updating...";
        busList.innerHTML = '<li class="message">Fetching live tracking data...</li>';

        // Upgraded endpoint to HTTPS
        const url = `https://transportapi.com/v3/uk/bus/stop/${stopCode}/live.json?app_id=${APP_ID}&app_key=${APP_KEY}&group=no&nextbuses=no`;

        try {
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error('Stop not found or API error');
            }

            const data = await response.json();
            
            busList.innerHTML = '';
            stopInfo.textContent = `Stop: ${data.stop_name} (${data.bearing ? data.bearing + '-bound' : ''})`;

            // Update timestamp
            const now = new Date();
            lastUpdated.textContent = `Last updated: ${now.toLocaleTimeString()}`;
            refreshBar.style.display = 'flex';

            const departures = data.departures.all;

            if (!departures || departures.length === 0) {
                busList.innerHTML = '<li class="message">No upcoming buses scheduled for this stop.</li>';
                return;
            }

            departures.forEach(bus => {
                const li = document.createElement('li');
                li.className = 'bus-item';

                let timeDisplay = bus.best_departure_estimate;
                let timeClass = 'bus-time';
                
                if (timeDisplay === '00:00' || timeDisplay === '00:01' || (timeDisplay && timeDisplay.toLowerCase().includes('due'))) {
                    timeDisplay = 'Due';
                    timeClass += ' due';
                }

                li.innerHTML = `
                    <div class="bus-number">${bus.line_name}</div>
                    <div class="bus-details">
                        <div class="bus-destination">${bus.direction}</div>
                        <div class="bus-operator">${bus.operator_name || 'Bus Operator'}</div>
                    </div>
                    <div class="${timeClass}">${timeDisplay}</div>
                `;

                busList.appendChild(li);
            });

        } catch (error) {
            console.error('Fetch error:', error);
            busList.innerHTML = '<li class="message" style="color:red;">Failed to load data. Please check the Stop Code and API keys.</li>';
        } finally {
            // Re-enable buttons and restore text
            getTimesBtn.disabled = false;
            refreshBtn.disabled = false;
            refreshBtn.textContent = "🔄 Update Now";
        }
    }
</script>

<iframe 
  src="https://journeyplanner.travelsouthyorkshire.com/?stoptype=tram_stop&fromcode=370020609" 
  width="100%" 
  height="600px" 
  style="border: none; border-radius: 8px;"
  title="Live Bus Departures">
</iframe>
    
</body>
</html>
